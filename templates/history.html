{% extends "base.html" %}
{% block content %}
<h1>Historial</h1>
{% if analyses %}
  <ul>
  {% for a in analyses %}
    <li><a href="{{ url_for('analysis_detail', analysis_id=a.id) }}">{{ a.created_at }}</a> - {{ a.verdict }} ({{ a.confidence }}%) - {{ a.filename }}</li>
  {% endfor %}
  </ul>
{% else %}
  <p>Aún no has analizado ningún correo.</p>
{% endif %}
{% endblock %}
