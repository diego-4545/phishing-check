{% extends "base.html" %}
{% block content %}
<h1>Registro</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Correo <input type="email" name="email" required maxlength="254"></label>
  <label>Contraseña (mínimo 8) <input type="password" name="password" required minlength="8"></label>
  <button type="submit">Crear cuenta</button>
</form>
{% endblock %}
