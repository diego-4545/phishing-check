<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Phishing Check{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav>
    <a href="{{ url_for('index') }}"><strong>Phishing Check</strong></a>
    <span>
      {% if session.get('user_id') %}
      <a href="{{ url_for('analyze') }}">Analizar</a>
        <a href="{{ url_for('history') }}">Historial</a>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button type="submit">Cerrar sesión</button>
        </form>
      {% else %}
        <a href="{{ url_for('login') }}">Iniciar sesión</a>
        <a href="{{ url_for('register') }}">Registrarse</a>
      {% endif %}
    </span>
  </nav>
  <main>
    {% for message in get_flashed_messages() %}
      <p class="flash">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
